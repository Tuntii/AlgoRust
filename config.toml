[app]
# Startup mode: "live" or "backtest"
mode = "backtest"
bootstrap_limit = 70000
auto_reconnect = true

[binance]
# true: Binance USD-M futures (fapi/fstream), false: spot (api/stream)
use_futures = true
# Optional: API credentials (needed for private endpoints/order APIs)

# Optional URL overrides
rest_base_url = "https://fapi.binance.com"
ws_base_url = "wss://fstream.binance.com"

[backtest]
output_dir = "backtest_results"
days = 365
exit_mode = "indicator_flip"
# SL/TP mekanizması: "pivot" | "orderblock" | "compare" (her ikisini test edip karşılaştırır)
sltp_mode = "orderblock"
send_alpaca_signals = false
# Local CSV backtest (optional - comment out to use Binance API)
# csv_file = "backtest_results/bitcoin_prices_all_time.csv"
# csv_symbol = "BTCUSDT"
# csv_timeframe = "1m"

[trading]
# 1m only mode
symbols = ["SOLUSDT", "ETHUSDT"]
timeframes = ["1m"]
# Live trade execution control
execute_trades = true
# Paper trading (simulated trading without real money)
use_paper_trader = false
paper_initial_balance = 300.0
paper_state_file = "paper_trader_state.json"
# Fixed risk amount per trade in USDT (Loss if SL hits = ~$5)
risk_amount_usdt = 5.0
# Leverage applied to all positions (careful!)
leverage = 2
# Kaç pozisyon aynı anda açık olabilir?
max_positions = 2
# Canlı çıkış modu: "sl_tp" (TP/SL order koy) | "indicator_flip" (sadece market entry, çıkış = karşı sinyal)
live_exit_mode = "indicator_flip"
# Trailing Stop: indicator_flip modunda kâr koruma mekanizması
# Fiyat TP mesafesinin %activation kadarına ulaşınca trailing stop aktif olur
# callback_rate: tepeden geri çekilme yüzdesi (0.1-5.0)
trailing_stop_enabled = true
trailing_callback_rate = 0.4
trailing_activation_pct = 0.35

[indicators]
ema_fast = [5, 8, 13]
ema_trend = 50
ema_macro = 200

[ml]
enabled = true
model_path = "models/lstm_filter.onnx"
meta_path = "models/lstm_meta.json"
onnxruntime_path = "C:/Users/tunay/AppData/Roaming/Python/Python313/site-packages/onnxruntime/capi/onnxruntime.dll"

[backtest.pool]
max_trade_duration_candles = 999999
be_threshold_candles = 7
be_min_profit_r = 0.1
